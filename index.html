<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Camera Color</title>
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --fg:#e8e8ea; --muted:#8a8a93; --accent:#ff7a1a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid #26262c; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--accent); letter-spacing:.5px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  select, input[type=range] { accent-color:var(--accent); }
  select { background:#222; color:var(--fg); border:1px solid #333; border-radius:6px; padding:3px 6px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:6px 12px; font-weight:600; cursor:pointer; }
  button.ghost { background:#222; color:var(--fg); border:1px solid #333; }
  main { flex:1; display:grid; place-items:center; overflow:hidden; padding:12px; }
  canvas#out { max-width:100%; max-height:100%; image-rendering:auto; }
  #msg { color:var(--muted); text-align:center; }
  video, canvas#src { display:none; }
</style>
</head>
<body>
<header>
  <h1>ASCII CAM</h1>
  <label>Mode
    <select id="mode">
      <option value="color">Warna asli</option>
      <option value="vivid">Warna vivid</option>
      <option value="block">Blok warna (bg)</option>
      <option value="matrix">Matrix hijau</option>
      <option value="mono">Hitam putih</option>
    </select>
  </label>
  <label>Karakter
    <select id="ramp">
      <option value=" .:-=+*#%@">Standar</option>
      <option value=" .'`^&quot;,:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Detail</option>
      <option value=" ░▒▓█">Blok</option>
      <option value=" 01">Biner</option>
      <option value="ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ">Katakana</option>
    </select>
  </label>
  <label>Kolom <input id="cols" type="range" min="40" max="240" value="120"><span id="colsV">120</span></label>
  <label>Kontras <input id="contrast" type="range" min="50" max="250" value="130"></label>
  <label><input id="invert" type="checkbox"> Invert</label>
  <label><input id="mirror" type="checkbox" checked> Mirror</label>
  <label><input id="whiteBg" type="checkbox"> Bg putih</label>
  <button id="snap">Snapshot PNG</button>
  <button id="pause" class="ghost">Pause</button>
</header>
<main>
  <p id="msg">Klik izinkan kamera…</p>
  <canvas id="out" hidden></canvas>
</main>
<video id="vid" playsinline muted></video>
<canvas id="src"></canvas>

<script>
const $ = id => document.getElementById(id);
const vid = $('vid'), src = $('src'), out = $('out');
const sctx = src.getContext('2d', { willReadFrequently: true });
const octx = out.getContext('2d');
const ui = ['mode','ramp','cols','contrast','invert','mirror','whiteBg'].reduce((o,k)=>(o[k]=$(k),o),{});
let paused = false;

ui.cols.oninput = () => $('colsV').textContent = ui.cols.value;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Lanjut' : 'Pause'; };
$('snap').onclick = () => {
  const a = document.createElement('a');
  a.download = 'ascii-' + Date.now() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
};

// Font cell: monospace ~0.6 lebar/tinggi. Sel sampling ikut rasio ini biar gambar tidak gepeng.
const FONT_PX = 10, CELL_W = 6, CELL_H = 10;

function boost(r, g, b, amt) {
  // naikkan saturasi di sekitar luminance
  const l = 0.299*r + 0.587*g + 0.114*b;
  return [l + (r-l)*amt, l + (g-l)*amt, l + (b-l)*amt].map(v => v < 0 ? 0 : v > 255 ? 255 : v|0);
}

function frame() {
  requestAnimationFrame(frame);
  if (paused || vid.readyState < 2) return;

  const cols = +ui.cols.value;
  const rows = Math.round(cols * (vid.videoHeight / vid.videoWidth) * (CELL_W / CELL_H));
  if (src.width !== cols || src.height !== rows) { src.width = cols; src.height = rows; }
  const W = cols * CELL_W, H = rows * CELL_H;
  if (out.width !== W || out.height !== H) { out.width = W; out.height = H; }

  sctx.save();
  if (ui.mirror.checked) { sctx.translate(cols, 0); sctx.scale(-1, 1); }
  sctx.drawImage(vid, 0, 0, cols, rows);
  sctx.restore();
  const px = sctx.getImageData(0, 0, cols, rows).data;

  const mode = ui.mode.value;
  const ramp = [...ui.ramp.value];
  const last = ramp.length - 1;
  const k = +ui.contrast.value / 100;
  const inv = ui.invert.checked;
  const lightBg = ui.whiteBg.checked;

  octx.fillStyle = lightBg ? '#fff' : '#000';
  octx.fillRect(0, 0, W, H);
  octx.font = `${FONT_PX}px "Cascadia Mono", Consolas, monospace`;
  octx.textBaseline = 'top';

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let r = px[i], g = px[i+1], b = px[i+2];
      let l = (0.299*r + 0.587*g + 0.114*b) / 255;
      l = Math.min(1, Math.max(0, (l - 0.5) * k + 0.5));
      // bg putih: karakter padat = gelap, jadi balik ramp
      let t = inv !== lightBg ? 1 - l : l;
      const ch = ramp[Math.round(t * last)];
      const px0 = x * CELL_W, py0 = y * CELL_H;

      let fill;
      if (mode === 'mono') {
        fill = lightBg ? '#000' : '#fff';
      } else if (mode === 'matrix') {
        fill = `rgb(0,${60 + (l*195)|0},${(l*70)|0})`;
      } else if (mode === 'vivid') {
        [r, g, b] = boost(r, g, b, 1.8);
        fill = `rgb(${r},${g},${b})`;
      } else if (mode === 'block') {
        octx.fillStyle = `rgb(${r*0.45|0},${g*0.45|0},${b*0.45|0})`;
        octx.fillRect(px0, py0, CELL_W, CELL_H);
        [r, g, b] = boost(r, g, b, 1.3);
        fill = `rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)})`;
      } else {
        fill = `rgb(${r},${g},${b})`;
      }
      if (ch === ' ') continue;
      octx.fillStyle = fill;
      octx.fillText(ch, px0, py0);
    }
  }
}

navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
  .then(stream => {
    vid.srcObject = stream;
    return vid.play();
  })
  .then(() => { $('msg').remove(); out.hidden = false; frame(); })
  .catch(err => { $('msg').textContent = 'Kamera gagal: ' + err.message + ' — buka lewat localhost/https.'; });
</script>
</body>
</html>
