<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Camera Color</title>
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --fg:#e8e8ea; --muted:#8a8a93; --accent:#ff7a1a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:8px 16px; background:var(--panel); border-bottom:1px solid #26262c; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--accent); letter-spacing:.5px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  select, input[type=range] { accent-color:var(--accent); }
  select { background:#222; color:var(--fg); border:1px solid #333; border-radius:6px; padding:3px 6px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:6px 12px; font-weight:600; cursor:pointer; }
  button.ghost { background:#222; color:var(--fg); border:1px solid #333; }
  #fps { color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto; }
  main { flex:1; min-height:0; position:relative; background:#000; }
  main:fullscreen { background:#000; }
  canvas#out { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:16px; }
  video { display:none; }
</style>
</head>
<body>
<header>
  <h1>ASCII CAM</h1>
  <label>Mode
    <select id="mode">
      <option value="color">Warna asli</option>
      <option value="vivid">Warna vivid</option>
      <option value="block">Blok warna (bg)</option>
      <option value="matrix">Matrix hijau</option>
      <option value="mono">Hitam putih</option>
    </select>
  </label>
  <label>Karakter
    <select id="ramp">
      <option value="detail">Detail 70</option>
      <option value="std">Standar 10</option>
      <option value="dense">Padat (semua ASCII)</option>
      <option value="block">Blok ░▒▓█</option>
      <option value="bin">Biner 01</option>
    </select>
  </label>
  <label>Kolom <input id="cols" type="range" min="60" max="400" step="10" value="220"><span id="colsV">220</span></label>
  <label>Kontras <input id="contrast" type="range" min="50" max="250" value="130"></label>
  <label><input id="invert" type="checkbox"> Invert</label>
  <label><input id="mirror" type="checkbox" checked> Mirror</label>
  <label><input id="whiteBg" type="checkbox"> Bg putih</label>
  <button id="snap">Snapshot PNG</button>
  <button id="pause" class="ghost">Pause</button>
  <button id="full" class="ghost">Fullscreen</button>
  <span id="fps"></span>
</header>
<main id="stage">
  <p id="msg">Klik izinkan kamera…</p>
  <canvas id="out" hidden></canvas>
</main>
<video id="vid" playsinline muted></video>

<script>
const $ = id => document.getElementById(id);
const vid = $('vid'), out = $('out');
const octx = out.getContext('2d');

// sumber kecil: 1 pixel = 1 karakter
const src = document.createElement('canvas');
const sctx = src.getContext('2d', { willReadFrequently: true });
// warna per sel (setelah filter mode)
const tint = document.createElement('canvas');
const tctx = tint.getContext('2d');
// layer karakter (alpha) yang nanti diwarnai
const layer = document.createElement('canvas');
const lctx = layer.getContext('2d');

const RAMPS = {
  detail: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  std: " .:-=+*#%@",
  dense: " `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@",
  block: " ░▒▓█",
  bin: " 01",
};

const ui = ['mode','ramp','cols','contrast','invert','mirror','whiteBg'].reduce((o,k)=>(o[k]=$(k),o),{});
let paused = false;

ui.cols.oninput = () => $('colsV').textContent = ui.cols.value;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Lanjut' : 'Pause'; };
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen();
$('snap').onclick = () => {
  const a = document.createElement('a');
  a.download = 'ascii-' + Date.now() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
};

// Ukuran sel. Lebar diukur dari font agar teks per baris pas di grid.
const FONT_PX = 12;
const FONT = `${FONT_PX}px "Cascadia Mono", Consolas, "Courier New", monospace`;
lctx.font = FONT;
const CELL_W = Math.ceil(lctx.measureText('M').width * 100) / 100;
const CELL_H = FONT_PX;

// Glyph atlas, dipakai kalau karakter ramp tidak sama lebar (mis. blok unicode di font tertentu)
const atlasCache = {};
function getAtlas(chars) {
  const key = chars.join('');
  if (atlasCache[key]) return atlasCache[key];
  const c = document.createElement('canvas');
  c.width = Math.ceil(CELL_W) * chars.length; c.height = CELL_H;
  const x = c.getContext('2d');
  x.font = FONT; x.textBaseline = 'top'; x.fillStyle = '#fff';
  chars.forEach((ch, i) => x.fillText(ch, i * Math.ceil(CELL_W), 0));
  const uniform = chars.every(ch => Math.abs(x.measureText(ch).width - CELL_W) < 0.05);
  return atlasCache[key] = { c, uniform };
}

const FILTERS = {
  color: 'none',
  vivid: 'saturate(1.9) contrast(1.1)',
  block: 'saturate(1.4) brightness(1.25)',
};

let last = performance.now(), frames = 0;

function frame() {
  requestAnimationFrame(frame);
  if (paused || vid.readyState < 2) return;

  const cols = +ui.cols.value;
  const rows = Math.round(cols * (vid.videoHeight / vid.videoWidth) * (CELL_W / CELL_H));
  const W = Math.round(cols * CELL_W), H = rows * CELL_H;
  for (const [c, w, h] of [[src, cols, rows], [tint, cols, rows], [layer, W, H], [out, W, H]]) {
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }

  // 1. ambil frame kecil
  sctx.save();
  if (ui.mirror.checked) { sctx.translate(cols, 0); sctx.scale(-1, 1); }
  sctx.drawImage(vid, 0, 0, cols, rows);
  sctx.restore();
  const px = sctx.getImageData(0, 0, cols, rows).data;

  // 2. pilih karakter per sel
  const chars = [...RAMPS[ui.ramp.value]];
  const n = chars.length - 1;
  const k = +ui.contrast.value / 100;
  const flip = ui.invert.checked !== ui.whiteBg.checked;
  const atlas = getAtlas(chars);

  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, W, H);
  lctx.font = FONT; lctx.textBaseline = 'top'; lctx.fillStyle = '#fff';
  const aw = Math.ceil(CELL_W);

  const matrix = ui.mode.value === 'matrix';
  const mImg = matrix ? sctx.createImageData(cols, rows) : null;

  for (let y = 0; y < rows; y++) {
    let line = '';
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let l = (0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2]) / 255;
      l = Math.min(1, Math.max(0, (l - 0.5) * k + 0.5));
      if (matrix) { // hijau ikut terang-gelap pixel, seperti versi awal
        const d = mImg.data;
        d[i] = 0; d[i+1] = 60 + l * 195; d[i+2] = l * 70; d[i+3] = 255;
      }
      const idx = Math.round((flip ? 1 - l : l) * n);
      if (atlas.uniform) line += chars[idx];
      else if (idx) lctx.drawImage(atlas.c, idx * aw, 0, aw, CELL_H, x * CELL_W, y * CELL_H, aw, CELL_H);
    }
    if (atlas.uniform) lctx.fillText(line, 0, y * CELL_H);
  }

  // 3. warnai karakter: source-in dengan gambar warna yang di-scale (pixelated)
  const mode = ui.mode.value;
  lctx.globalCompositeOperation = 'source-in';
  if (mode === 'mono') {
    lctx.fillStyle = ui.whiteBg.checked ? '#000' : '#fff';
    lctx.fillRect(0, 0, W, H);
  } else if (matrix) {
    tctx.putImageData(mImg, 0, 0);
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(tint, 0, 0, W, H);
  } else {
    tctx.filter = FILTERS[mode];
    tctx.drawImage(src, 0, 0);
    tctx.filter = 'none';
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(tint, 0, 0, W, H);
  }

  // 4. komposit ke layar
  octx.fillStyle = ui.whiteBg.checked ? '#fff' : '#000';
  octx.fillRect(0, 0, W, H);
  if (mode === 'block') {
    octx.imageSmoothingEnabled = false;
    octx.filter = 'brightness(0.4)';
    octx.drawImage(src, 0, 0, W, H);
    octx.filter = 'none';
  }
  octx.drawImage(layer, 0, 0);

  frames++;
  const now = performance.now();
  if (now - last > 500) { $('fps').textContent = `${cols}×${rows} · ${Math.round(frames * 1000 / (now - last))} fps`; frames = 0; last = now; }
}

navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
  .then(stream => { vid.srcObject = stream; return vid.play(); })
  .then(() => { $('msg').remove(); out.hidden = false; frame(); })
  .catch(err => { $('msg').textContent = 'Kamera gagal: ' + err.message + ' — buka lewat localhost/https.'; });
</script>
</body>
</html>
