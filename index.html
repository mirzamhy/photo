<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Camera Color</title>
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --fg:#e8e8ea; --muted:#8a8a93; --accent:#ff7a1a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:8px 16px; background:var(--panel); border-bottom:1px solid #26262c; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--accent); letter-spacing:.5px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  select, input[type=range] { accent-color:var(--accent); }
  select { background:#222; color:var(--fg); border:1px solid #333; border-radius:6px; padding:3px 6px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:6px 12px; font-weight:600; cursor:pointer; }
  button.ghost { background:#222; color:var(--fg); border:1px solid #333; }
  #fps { color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto; }
  main { flex:1; min-height:0; position:relative; background:#000; }
  main:fullscreen { background:#000; }
  canvas#out { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:16px; }
  video { display:none; }

  /* photobooth */
  #count { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
    font:700 min(40vh, 40vw)/1 "Cascadia Mono", Consolas, monospace; color:#fff;
    text-shadow:0 0 30px rgba(0,0,0,.8); opacity:0; transition:opacity .15s; }
  #count.on { opacity:1; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .4s ease-out; }
  #flash.on { opacity:1; transition:none; }
  #tray { position:absolute; left:12px; bottom:12px; display:flex; gap:8px; pointer-events:none; }
  #tray canvas { height:64px; border:2px solid #fff; border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.6); }
  #shotInfo { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6);
    padding:4px 12px; border-radius:999px; font-weight:600; display:none; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid #333; border-radius:12px; padding:20px; max-width:min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog h2 { margin:0 0 14px; font-size:18px; }
  .opts { display:grid; gap:14px; }
  .opts > div > span { display:block; color:var(--muted); margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { color:var(--fg); background:#222; border:1px solid #333; border-radius:8px; padding:6px 10px; cursor:pointer; }
  .chips label:has(input:checked) { border-color:var(--accent); background:#2a1a0e; }
  .chips input { display:none; }
  input[type=text] { width:100%; background:#222; color:var(--fg); border:1px solid #333; border-radius:6px; padding:7px 9px; font:inherit; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
  #result img { display:block; max-width:100%; max-height:65vh; margin:0 auto; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>ASCII CAM</h1>
  <label>Mode
    <select id="mode">
      <option value="color">Warna asli</option>
      <option value="vivid">Warna vivid</option>
      <option value="block">Blok warna (bg)</option>
      <option value="matrix">Matrix hijau</option>
      <option value="mono">Hitam putih</option>
      <option value="tricolor">Hijau-Biru-Merah</option>
    </select>
  </label>
  <label>Karakter
    <select id="ramp">
      <option value="detail">Detail 70</option>
      <option value="std">Standar 10</option>
      <option value="dense">Padat (semua ASCII)</option>
      <option value="block">Blok ░▒▓█</option>
      <option value="bin">Biner 01</option>
    </select>
  </label>
  <label>Kolom <input id="cols" type="range" min="60" max="400" step="10" value="220"><span id="colsV">220</span></label>
  <label>Kontras <input id="contrast" type="range" min="50" max="250" value="130"></label>
  <label><input id="invert" type="checkbox"> Invert</label>
  <label><input id="mirror" type="checkbox" checked> Mirror</label>
  <label><input id="whiteBg" type="checkbox"> Bg putih</label>
  <button id="boothBtn">Photobooth</button>
  <button id="snap" class="ghost">Snapshot PNG</button>
  <button id="pause" class="ghost">Pause</button>
  <button id="full" class="ghost">Fullscreen</button>
  <span id="fps"></span>
</header>
<main id="stage">
  <p id="msg">Klik izinkan kamera…</p>
  <canvas id="out" hidden></canvas>
  <div id="flash"></div>
  <div id="count"></div>
  <div id="shotInfo"></div>
  <div id="tray"></div>
</main>
<video id="vid" playsinline muted></video>

<dialog id="setup">
  <h2>Photobooth</h2>
  <div class="opts">
    <div><span>Layout</span>
      <div class="chips">
        <label><input type="radio" name="layout" value="strip4" checked>Strip 4</label>
        <label><input type="radio" name="layout" value="strip3">Strip 3</label>
        <label><input type="radio" name="layout" value="grid">Grid 2×2</label>
        <label><input type="radio" name="layout" value="single">1 foto</label>
      </div>
    </div>
    <div><span>Hitung mundur</span>
      <div class="chips">
        <label><input type="radio" name="timer" value="3" checked>3 detik</label>
        <label><input type="radio" name="timer" value="5">5 detik</label>
        <label><input type="radio" name="timer" value="10">10 detik</label>
      </div>
    </div>
    <div><span>Bingkai</span>
      <div class="chips">
        <label><input type="radio" name="frame" value="film" checked>Film hitam</label>
        <label><input type="radio" name="frame" value="classic">Putih klasik</label>
        <label><input type="radio" name="frame" value="receipt">Struk</label>
        <label><input type="radio" name="frame" value="pink">Pink</label>
      </div>
    </div>
    <div><span>Tulisan</span><input id="caption" type="text" maxlength="28" value="ASCII BOOTH"></div>
  </div>
  <div class="row">
    <button class="ghost" id="cancelBooth">Batal</button>
    <button id="startBooth">Mulai</button>
  </div>
</dialog>

<dialog id="result">
  <h2>Hasil photobooth</h2>
  <img id="stripImg" alt="Strip foto ASCII">
  <div class="row">
    <button class="ghost" id="closeResult">Tutup</button>
    <button class="ghost" id="retake">Ulangi</button>
    <button id="download">Unduh PNG</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const vid = $('vid'), out = $('out');
const octx = out.getContext('2d');

// sumber kecil: 1 pixel = 1 karakter
const src = document.createElement('canvas');
const sctx = src.getContext('2d', { willReadFrequently: true });
// warna per sel (setelah filter mode)
const tint = document.createElement('canvas');
const tctx = tint.getContext('2d');
// layer karakter (alpha) yang nanti diwarnai
const layer = document.createElement('canvas');
const lctx = layer.getContext('2d');

const RAMPS = {
  detail: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  std: " .:-=+*#%@",
  dense: " `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@",
  block: " ░▒▓█",
  bin: " 01",
};

const ui = ['mode','ramp','cols','contrast','invert','mirror','whiteBg'].reduce((o,k)=>(o[k]=$(k),o),{});
let paused = false;

ui.cols.oninput = () => $('colsV').textContent = ui.cols.value;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Lanjut' : 'Pause'; };
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen();
$('snap').onclick = () => {
  const a = document.createElement('a');
  a.download = 'ascii-' + Date.now() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
};

// Ukuran sel. Lebar diukur dari font agar teks per baris pas di grid.
const FONT_PX = 12;
const FONT = `${FONT_PX}px "Cascadia Mono", Consolas, "Courier New", monospace`;
lctx.font = FONT;
const CELL_W = Math.ceil(lctx.measureText('M').width * 100) / 100;
const CELL_H = FONT_PX;

// Glyph atlas, dipakai kalau karakter ramp tidak sama lebar (mis. blok unicode di font tertentu)
const atlasCache = {};
function getAtlas(chars) {
  const key = chars.join('');
  if (atlasCache[key]) return atlasCache[key];
  const c = document.createElement('canvas');
  c.width = Math.ceil(CELL_W) * chars.length; c.height = CELL_H;
  const x = c.getContext('2d');
  x.font = FONT; x.textBaseline = 'top'; x.fillStyle = '#fff';
  chars.forEach((ch, i) => x.fillText(ch, i * Math.ceil(CELL_W), 0));
  const uniform = chars.every(ch => Math.abs(x.measureText(ch).width - CELL_W) < 0.05);
  return atlasCache[key] = { c, uniform };
}

const FILTERS = {
  color: 'none',
  vivid: 'saturate(1.9) contrast(1.1)',
  block: 'saturate(1.4) brightness(1.25)',
};

let last = performance.now(), frames = 0;

function frame() {
  requestAnimationFrame(frame);
  if (paused || vid.readyState < 2) return;

  const cols = +ui.cols.value;
  const rows = Math.round(cols * (vid.videoHeight / vid.videoWidth) * (CELL_W / CELL_H));
  const W = Math.round(cols * CELL_W), H = rows * CELL_H;
  for (const [c, w, h] of [[src, cols, rows], [tint, cols, rows], [layer, W, H], [out, W, H]]) {
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }

  // 1. ambil frame kecil
  sctx.save();
  if (ui.mirror.checked) { sctx.translate(cols, 0); sctx.scale(-1, 1); }
  sctx.drawImage(vid, 0, 0, cols, rows);
  sctx.restore();
  const px = sctx.getImageData(0, 0, cols, rows).data;

  // 2. pilih karakter per sel
  const chars = [...RAMPS[ui.ramp.value]];
  const n = chars.length - 1;
  const k = +ui.contrast.value / 100;
  const tri = ui.mode.value === 'tricolor';
  const lightBg = ui.whiteBg.checked && !tri;
  const flip = ui.invert.checked !== lightBg;
  const atlas = getAtlas(chars);

  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, W, H);
  lctx.font = FONT; lctx.textBaseline = 'top'; lctx.fillStyle = '#fff';
  const aw = Math.ceil(CELL_W);

  const matrix = ui.mode.value === 'matrix';
  const mImg = matrix ? sctx.createImageData(cols, rows) : null;

  for (let y = 0; y < rows; y++) {
    let line = '';
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let l = (0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2]) / 255;
      l = Math.min(1, Math.max(0, (l - 0.5) * k + 0.5));
      if (matrix) { // hijau ikut terang-gelap pixel, seperti versi awal
        const d = mImg.data;
        d[i] = 0; d[i+1] = 60 + l * 195; d[i+2] = l * 70; d[i+3] = 255;
      }
      const idx = Math.round((flip ? 1 - l : l) * n);
      if (atlas.uniform) line += chars[idx];
      else if (idx) lctx.drawImage(atlas.c, idx * aw, 0, aw, CELL_H, x * CELL_W, y * CELL_H, aw, CELL_H);
    }
    if (atlas.uniform) lctx.fillText(line, 0, y * CELL_H);
  }

  // 3. warnai karakter: source-in dengan gambar warna yang di-scale (pixelated)
  const mode = ui.mode.value;
  lctx.globalCompositeOperation = 'source-in';
  if (mode === 'mono' || tri) {
    lctx.fillStyle = lightBg ? '#000' : '#fff';
    lctx.fillRect(0, 0, W, H);
  } else if (matrix) {
    tctx.putImageData(mImg, 0, 0);
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(tint, 0, 0, W, H);
  } else {
    tctx.filter = FILTERS[mode];
    tctx.drawImage(src, 0, 0);
    tctx.filter = 'none';
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(tint, 0, 0, W, H);
  }

  // 4. komposit ke layar
  if (tri) {
    // tiga panel solid: hijau | biru | merah
    const panels = ['#118a2c', '#0a2fa8', '#e00c0c'];
    const pw = W / 3;
    panels.forEach((c, i) => {
      octx.fillStyle = c;
      octx.fillRect(Math.floor(i * pw), 0, Math.ceil(pw) + 1, H);
    });
  } else {
    octx.fillStyle = lightBg ? '#fff' : '#000';
    octx.fillRect(0, 0, W, H);
  }
  if (mode === 'block') {
    octx.imageSmoothingEnabled = false;
    octx.filter = 'brightness(0.4)';
    octx.drawImage(src, 0, 0, W, H);
    octx.filter = 'none';
  }
  octx.drawImage(layer, 0, 0);

  frames++;
  const now = performance.now();
  if (now - last > 500) { $('fps').textContent = `${cols}×${rows} · ${Math.round(frames * 1000 / (now - last))} fps`; frames = 0; last = now; }
}

navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
  .then(stream => { vid.srcObject = stream; return vid.play(); })
  .then(() => { $('msg').remove(); out.hidden = false; frame(); })
  .catch(err => { $('msg').textContent = 'Kamera gagal: ' + err.message + ' — buka lewat localhost/https.'; });
</script>

<script>
// ---------- Photobooth ----------
const LAYOUTS = {
  strip4: { cols: 1, rows: 4, pw: 600 },
  strip3: { cols: 1, rows: 3, pw: 600 },
  grid:   { cols: 2, rows: 2, pw: 520 },
  single: { cols: 1, rows: 1, pw: 900 },
};
const FRAMES = {
  film:    { bg: '#111',    ink: '#f2f2f2', sub: '#9a9a9a', line: '#000' },
  classic: { bg: '#fff',    ink: '#111',    sub: '#777',    line: '#ddd' },
  receipt: { bg: '#f5f2e9', ink: '#222',    sub: '#666',    line: '#222' },
  pink:    { bg: '#ffc8dd', ink: '#6a1b3a', sub: '#a14d72', line: '#fff' },
};
const MONO = '"Cascadia Mono", Consolas, "Courier New", monospace';
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = name => document.querySelector(`input[name=${name}]:checked`).value;

let shots = [], lastStrip = null, running = false;

$('boothBtn').onclick = () => { if (!running) $('setup').showModal(); };
$('cancelBooth').onclick = () => $('setup').close();
$('startBooth').onclick = () => { $('setup').close(); runBooth(); };
$('closeResult').onclick = () => $('result').close();
$('retake').onclick = () => { $('result').close(); runBooth(); };
$('download').onclick = () => {
  if (!lastStrip) return;
  const a = document.createElement('a');
  a.download = 'photobooth-' + Date.now() + '.png';
  a.href = lastStrip.toDataURL('image/png');
  a.click();
};

async function runBooth() {
  if (running || out.hidden) return;
  running = true;
  paused = false; $('pause').textContent = 'Pause';
  $('boothBtn').disabled = true;
  const layout = LAYOUTS[pick('layout')];
  const total = layout.cols * layout.rows;
  const secs = +pick('timer');
  shots = [];
  $('tray').innerHTML = '';
  const info = $('shotInfo'), count = $('count');
  info.style.display = 'block';

  for (let n = 0; n < total; n++) {
    info.textContent = `Foto ${n + 1} / ${total}`;
    for (let s = secs; s > 0; s--) {
      count.textContent = s;
      count.classList.add('on');
      await wait(1000);
    }
    count.classList.remove('on');
    // ambil frame tepat sebelum flash
    const shot = document.createElement('canvas');
    shot.width = out.width; shot.height = out.height;
    shot.getContext('2d').drawImage(out, 0, 0);
    shots.push(shot);
    $('flash').classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => $('flash').classList.remove('on')));
    $('tray').appendChild(shot.cloneNode()).getContext('2d').drawImage(shot, 0, 0);
    await wait(900);
  }

  info.style.display = 'none';
  lastStrip = composeStrip(shots, layout, pick('frame'), $('caption').value.trim());
  $('stripImg').src = lastStrip.toDataURL('image/png');
  $('tray').innerHTML = '';
  $('boothBtn').disabled = false;
  running = false;
  $('result').showModal();
}

function composeStrip(shots, L, frameKey, caption) {
  const F = FRAMES[frameKey];
  const film = frameKey === 'film', receipt = frameKey === 'receipt';
  const PW = L.pw, PH = Math.round(PW * shots[0].height / shots[0].width);
  const gap = 20, padX = film ? 70 : 34, padTop = receipt ? 120 : 34;
  const footer = receipt ? 190 : 130;
  const W = padX * 2 + L.cols * PW + (L.cols - 1) * gap;
  const H = padTop + L.rows * PH + (L.rows - 1) * gap + footer;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');

  // latar
  x.fillStyle = F.bg;
  if (receipt) {
    // tepi sobek zigzag atas-bawah
    const z = 14;
    x.beginPath(); x.moveTo(0, z);
    for (let i = 0; i <= W; i += z * 2) { x.lineTo(i + z, 0); x.lineTo(i + z * 2, z); }
    x.lineTo(W, H - z);
    for (let i = W; i >= 0; i -= z * 2) { x.lineTo(i - z, H); x.lineTo(i - z * 2, H - z); }
    x.closePath(); x.fill();
  } else {
    x.fillRect(0, 0, W, H);
  }

  // lubang film di dua sisi
  if (film) {
    x.fillStyle = '#e8e8e8';
    for (let y = 18; y < H - 18; y += 44) {
      for (const sx of [22, W - 22 - 26]) {
        x.beginPath(); x.roundRect(sx, y, 26, 20, 4); x.fill();
      }
    }
  }

  x.textAlign = 'center';
  x.fillStyle = F.ink;
  if (receipt) {
    x.font = `700 34px ${MONO}`;
    x.fillText('*** ASCII BOOTH ***', W / 2, 64);
    x.font = `20px ${MONO}`;
    x.fillStyle = F.sub;
    x.fillText('-'.repeat(Math.floor((W - 60) / 12)), W / 2, 96);
  }

  // foto
  shots.forEach((s, i) => {
    const cx = padX + (i % L.cols) * (PW + gap);
    const cy = padTop + Math.floor(i / L.cols) * (PH + gap);
    x.drawImage(s, cx, cy, PW, PH);
    x.strokeStyle = F.line; x.lineWidth = 2;
    x.strokeRect(cx + 1, cy + 1, PW - 2, PH - 2);
  });

  // tulisan bawah
  const now = new Date();
  const p2 = v => String(v).padStart(2, '0');
  const stamp = `${p2(now.getDate())}.${p2(now.getMonth() + 1)}.${now.getFullYear()}  ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  let y = H - footer + 58;
  if (receipt) {
    x.font = `20px ${MONO}`; x.fillStyle = F.sub;
    x.fillText('-'.repeat(Math.floor((W - 60) / 12)), W / 2, y - 22);
    y += 12;
  }
  x.fillStyle = F.ink;
  x.font = `700 ${L.cols > 1 ? 40 : 36}px ${MONO}`;
  x.fillText(caption || 'ASCII BOOTH', W / 2, y);
  x.font = `22px ${MONO}`; x.fillStyle = F.sub;
  x.fillText(stamp, W / 2, y + 38);
  if (receipt) x.fillText(`${shots.length} FOTO  ·  TERIMA KASIH`, W / 2, y + 72);
  return c;
}
</script>
</body>
</html>
